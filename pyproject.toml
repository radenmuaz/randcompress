[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "randcompress"
version = "0.1.0"
description = "Random compression utilities"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Raden Muaz Munim"}]
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "tqdm",
    "jax>=0.6.2",
    "equinox>=0.13.8",
    "optax>=0.2.8",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
compress = ["zstandard", "lz4"]
bench = ["zstandard", "lz4"]
dev = ["zstandard", "lz4", "pytest"]

[project.urls]
Repository = "https://github.com/yourusername/randcompress"

[tool.setuptools]
packages = ["overfitter", "overfitter_peft", "overfitter_v1", "enfrac", "enfrac_baseline"]
